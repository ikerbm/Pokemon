name: Pokemon Daily

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:
  pokemon:
    runs-on: ubuntu-latest
    permissions: 
        contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecucion
        run: python src/main.py

      - name: commit-push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          message: update pokemon      
